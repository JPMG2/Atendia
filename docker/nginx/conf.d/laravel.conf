upstream php-fpm {
    server 127.0.0.1:9000;
    keepalive 32;
}

# Reverb corre en el MISMO contenedor (supervisor: laravel-reverb, puerto 8080).
upstream reverb {
    server 127.0.0.1:8080;
}

# Traefik termina el TLS y nos pasa Connection: upgrade. Este mapa reenvia ese
# header tal cual: si no viene un upgrade, mandamos "close" (si mandaramos
# "upgrade" fijo, rompemos las requests HTTP normales a /apps/*/events).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/atendia-access.log;
    error_log /var/log/nginx/atendia-error.log warn;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Assets/rutas de Livewire — son RUTAS dinámicas, no archivos en disco.
    # Livewire 4 usa un prefijo HASHEADO (ej. /livewire-8e1f1de1/livewire.js),
    # por eso matcheamos /livewire- y /livewire/. Va ANTES del regex de estáticos
    # (primer regex que matchea gana) para que .js/.css de Livewire vayan a PHP y
    # no devuelvan 404 (lo que rompe Livewire/Alpine).
    location ~* ^/livewire[-/] {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb (WebSocket) por el MISMO origen que el sitio.
    # El navegador entra por https (Traefik), y pusher-js FUERZA wss cuando la
    # pagina es https — da igual lo que diga forceTLS. Como Reverb habla ws
    # plano en el 8080, conectarse directo a IP:8080 falla siempre. Proxeando
    # aca, el wss viaja por el 443 de Traefik (mismo certificado que el sitio)
    # y llega a Reverb ya desencriptado. Nada de puertos extra ni contenido mixto.
    #
    # `^~` es obligatorio: sin el, el regex de estaticos de mas abajo podria
    # ganarle a este prefijo y devolver 404. Ninguna ruta de Laravel usa
    # /app/ ni /apps/, asi que no hay colision.
    #   /app/{key}          -> handshake del WebSocket
    #   /apps/{id}/events   -> API HTTP que usa el server para publicar
    location ^~ /app/ {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Una conexion WebSocket esta callada largo rato entre pings. Con el
        # default de 60s nginx la corta y el cliente reconecta en loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /apps/ {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        fastcgi_keep_conn on;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny .htaccess
    location ~ /\.ht {
        deny all;
    }
}
