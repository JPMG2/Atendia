services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: atendia-app:latest
    container_name: atendia-app
    restart: unless-stopped
    working_dir: /var/www/html

    # Codigo montado en vivo -> editas con VS Code y se refleja al instante
    volumes:
      - ./:/var/www/html
      # /root PERSISTENTE: sobrevive a rebuilds y a recrear el contenedor.
      # Adentro viven las tres cosas que antes se perdian en cada rebuild:
      #   .codex/auth.json          -> login de Codex
      #   .claude/ + .claude.json   -> credenciales e historial de Claude Code
      #   .vscode-server/extensions -> extensiones de VS Code (2 GB)
      # OJO: al ser volumen, /root queda CONGELADO respecto de la imagen. Si en
      # el Dockerfile cambias PLAYWRIGHT_VERSION (browsers en /root/.cache) o el
      # config.toml de Codex, hay que refrescarlo a mano dentro del volumen.
      - root-home:/root

    # Token de larga duracion de Claude Code (extension de VS Code dentro del
    # contenedor). Archivo opcional y gitignored: si no existe, no pasa nada.
    # Se genera con: ./docker/wire-claude-token.sh
    env_file:
      - path: ./.claude-code.env
        required: false

    networks:
      - easypanel              # red de Traefik + alcanza postgres/redis
      - easypanel-ai_project   # red compartida de la infra (postgres/redis)

    # Acceso directo opcional para pruebas: http://IP:8081
    ports:
      - "8081:80"
      # Reverb (WebSocket). El navegador se conecta directo a este puerto.
      - "8080:8080"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      # Router HTTP: cualquier IP pelada -> AtendIa (prioridad alta vence a EasyPanel)
      - "traefik.http.routers.atendia-http.rule=HostRegexp(`^[0-9.]+$`)"
      - "traefik.http.routers.atendia-http.entrypoints=http"
      - "traefik.http.routers.atendia-http.priority=100"
      - "traefik.http.routers.atendia-http.service=atendia-svc"
      # Router HTTPS: misma regla, con certificado por defecto (autofirmado hasta tener dominio)
      - "traefik.http.routers.atendia-https.rule=HostRegexp(`^[0-9.]+$`)"
      - "traefik.http.routers.atendia-https.entrypoints=https"
      - "traefik.http.routers.atendia-https.priority=100"
      - "traefik.http.routers.atendia-https.tls=true"
      - "traefik.http.routers.atendia-https.service=atendia-svc"
      # Servicio -> puerto 80 del contenedor (nginx)
      - "traefik.http.services.atendia-svc.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Atrapa TODO el correo de la app para verlo a ojo: UI en https://IP/mailpit
  # (con usuario/clave; credencial en .env -> MAILPIT_UI_AUTH, no se commitea).
  # La app le habla por SMTP interno: MAIL_HOST=mailpit, puerto 1025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: atendia-mailpit
    restart: unless-stopped
    environment:
      # La UI vive bajo /mailpit para colgarla de la misma IP que el sitio
      MP_WEBROOT: /mailpit
      # user:pass leido del .env (interpolacion de compose); vacio = sin auth
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    networks:
      - easypanel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      # Prioridad > 100 para ganarle al router del sitio en /mailpit
      - "traefik.http.routers.atendia-mailpit-http.rule=HostRegexp(`^[0-9.]+$`) && PathPrefix(`/mailpit`)"
      - "traefik.http.routers.atendia-mailpit-http.entrypoints=http"
      - "traefik.http.routers.atendia-mailpit-http.priority=110"
      - "traefik.http.routers.atendia-mailpit-http.service=atendia-mailpit-svc"
      - "traefik.http.routers.atendia-mailpit-https.rule=HostRegexp(`^[0-9.]+$`) && PathPrefix(`/mailpit`)"
      - "traefik.http.routers.atendia-mailpit-https.entrypoints=https"
      - "traefik.http.routers.atendia-mailpit-https.priority=110"
      - "traefik.http.routers.atendia-mailpit-https.tls=true"
      - "traefik.http.routers.atendia-mailpit-https.service=atendia-mailpit-svc"
      - "traefik.http.services.atendia-mailpit-svc.loadbalancer.server.port=8025"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  root-home:
    # Se sembro con el /root del contenedor viejo (tar) el 2026-08-12.
    name: atendia-root-home
    external: true

networks:
  easypanel:
    external: true
  easypanel-ai_project:
    external: true
